<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Gradline app icon (v2 - bolder)
       Concept: a mortarboard (quartered diamond + thick head-band) whose tassel
       is a heavy cord that plugs directly into an ascending staircase of bars —
       a literal, unmistakable "progress timeline" — capped with growing
       checkpoint dots connected by a thick line. 2 colors only. -->

  <!-- Container -->
  <rect x="4" y="4" width="92" height="92" rx="20" fill="#1B2A4A"/>

  <!-- Mortarboard diamond (cap top), with bold outline for definition -->
  <path d="M28,16 L50,34 L28,52 L6,34 Z" fill="#F4B942" stroke="#1B2A4A" stroke-width="3" stroke-linejoin="round"/>

  <!-- Quartered seams, reinforcing the classic mortarboard silhouette -->
  <path d="M28,16 L28,52 M6,34 L50,34" stroke="#1B2A4A" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Cap head-band, thick and unmistakable -->
  <rect x="10" y="52" width="36" height="14" rx="7" fill="#F4B942" stroke="#1B2A4A" stroke-width="3"/>

  <!-- Button where the cord leaves the cap -->
  <circle cx="28" cy="34" r="5.5" fill="#1B2A4A"/>

  <!-- Heavy cord plugging straight into the timeline -->
  <path d="M50,34 L58.5,68" fill="none" stroke="#F4B942" stroke-width="8" stroke-linecap="round"/>

  <!-- Ascending staircase bars: the progress timeline, literal and bold -->
  <rect x="52" y="68" width="13" height="16" rx="2" fill="#F4B942"/>
  <rect x="67" y="54" width="13" height="30" rx="2" fill="#F4B942"/>
  <rect x="82" y="38" width="13" height="46" rx="2" fill="#F4B942"/>

  <!-- Checkpoint line across the bar tops, growing dots as milestones -->
  <path d="M58.5,68 L73.5,54 L88.5,38" fill="none" stroke="#1B2A4A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="58.5" cy="68" r="5" fill="#F4B942" stroke="#1B2A4A" stroke-width="3"/>
  <circle cx="73.5" cy="54" r="5.5" fill="#F4B942" stroke="#1B2A4A" stroke-width="3"/>
  <circle cx="88.5" cy="38" r="6.5" fill="#F4B942" stroke="#1B2A4A" stroke-width="3"/>
</svg>
